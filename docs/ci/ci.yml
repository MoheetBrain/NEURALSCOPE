# Template: copy to .github/workflows/ci.yml to enable (pushing workflow files needs a token with `workflow` scope).
# NeuralScope CI. Manual trigger only (no automatic Actions usage); add `push`/`pull_request` triggers to enable.
name: ci
on:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - name: Fast tests (fixture model + Math Lab oracle; downloads the Qwen tokenizer only)
        run: python -m pytest -m "not slow" -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
