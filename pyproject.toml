[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralscope"
version = "0.1.0"
description = "NeuralScope — a causal debugger for learned intelligence (V1: neural debugger + Math Lab)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.46",
  "safetensors>=0.4",
  "numpy>=1.26",
  "sympy>=1.12",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["packages/neuralscope", "apps/api"]
include = ["neuralscope*", "neuralscope_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: loads a real pretrained model (Qwen2.5); deselect with -m 'not slow'",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
